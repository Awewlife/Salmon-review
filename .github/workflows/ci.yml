name: Verify local application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run notices:check
      - run: npm audit --omit=dev --audit-level=low
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -p test_release_package.py
      - run: docker build -t salmon-review:ci -t salmon-review:bundle-test .
      - run: docker run --rm --mount type=bind,source="${{ github.workspace }}/tests",target=/app/tests,readonly salmon-review:ci node --test tests/*.test.js
      - name: Verify updater self-replacement and recovery in isolated Docker project
        shell: pwsh
        run: ./tests/run-bundle-docker.ps1
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 installer regression
        shell: powershell
        run: ./tests/installer.Tests.ps1
      - name: PowerShell 7 installer regression
        shell: pwsh
        run: ./tests/installer.Tests.ps1
