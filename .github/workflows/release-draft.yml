name: Stage unsigned assets to an existing draft
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag and draft release
        required: true
permissions:
  contents: read
jobs:
  verify-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require an unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
  stage:
    needs: verify-draft
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ inputs.tag }}
