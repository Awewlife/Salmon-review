services:
  app:
    image: salmon-review:0.3.5
    pull_policy: never
    platform: linux/amd64
    init: true
    ports:
      - "127.0.0.1:${SALMON_PORT:-8787}:8787"
    volumes:
      - salmon-data:/data
    restart: unless-stopped
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  salmon-data:
